<body>
  <a class="skip" href="#catalogue-search">跳到条目检索</a>
  <header class="site-header frame"><a class="brand" href="index.html">蛊界档案馆</a><nav aria-label="主导航"><a href="index.html#index">人物档案</a><a href="techniques.html" aria-current="page">蛊虫与杀招</a><a href="story.html">剧情精读</a><a href="columns.html">人物专栏</a><a href="renzu.html">人祖传</a><a href="scenes.html">名场面</a><a href="search.html">全站搜索</a></nav></header>
  <main class="frame technique-main" id="top">
    <header class="technique-heading"><div><h1>蛊虫与杀招大全</h1><p>从一只月光蛊，到尊者交锋时的底牌。</p></div><a href="index.html#index">按人物阅读 →</a></header>
    <section aria-label="条目检索" class="technique-tools">
      <label class="technique-search" for="catalogue-search"><span>搜索名称、用途、原文或人物</span><input type="search" id="catalogue-search" name="q" placeholder="试试：春秋蝉、楚度、逆流河…" autocomplete="off"></label>
      <details class="technique-filters" id="catalogue-filters" open><summary>流派、品阶与人物筛选</summary><div class="technique-selects">
        <label for="catalogue-path"><span>流派</span><select id="catalogue-path" name="path"><option value="">全部流派</option></select></label>
        <label for="catalogue-rank"><span>品阶记载</span><select id="catalogue-rank" name="rank"><option value="">全部品阶</option></select></label>
        <label for="catalogue-person"><span>关联人物</span><select id="catalogue-person" name="person"><option value="">全部人物</option></select></label>
        <label for="catalogue-sort"><span>排序</span><select id="catalogue-sort" name="sort"><option value="featured">重点条目在前</option><option value="name">按名称排序</option><option value="appearance">按原文出场顺序</option><option value="chapters">按出现章数</option></select></label>
      </div></details>
    </section>
    <nav class="technique-categories" aria-label="条目分类" id="catalogue-categories"></nav>
    <div class="technique-workspace">
      <section class="technique-index" aria-labelledby="catalogue-title">
        <div class="technique-list-heading"><h2 id="catalogue-title">条目索引</h2><span id="catalogue-count" role="status"></span></div>
        <ul class="technique-list" id="catalogue-list" aria-label="检索结果"></ul>
        <div class="technique-empty" id="catalogue-empty" hidden><p>没有符合这些条件的条目。</p><button id="catalogue-reset" type="button">清除筛选</button></div>
        <nav class="technique-pager" aria-label="条目列表翻页"><button id="catalogue-previous" type="button">← 上一页</button><span id="catalogue-page"></span><button id="catalogue-next" type="button">下一页 →</button></nav>
      </section>
      <article class="technique-detail" id="catalogue-detail" tabindex="-1" aria-labelledby="technique-name"><h2 id="technique-name">正在载入条目…</h2></article>
    </div>
    <p class="technique-note">用途说明为整理，展开段落为原著摘录。品阶记录含不同阶段与原文设想；关联人物包括创造者、使用者、继承者及相关情节人物。</p>
    <noscript><p>启用 JavaScript 后可检索全部条目。<a href="index.html">返回人物档案</a></p></noscript>
  </main>
  <footer class="site-footer frame"><span>蛊界档案馆</span><nav aria-label="页尾导航"><a href="index.html">人物档案</a><a href="#top">回到页首 ↑</a></nav></footer>
</body>
</html>
